basePath: /api
definitions:
  dto.Achievement:
    properties:
      action:
        $ref: '#/definitions/models.Actions'
      description:
        type: string
      iconUrl:
        type: string
      id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      userAchievements:
        items:
          $ref: '#/definitions/dto.UserAchievement'
        type: array
    type: object
  dto.ActionRuleDTO:
    properties:
      action:
        type: string
      rules:
        additionalProperties:
          type: boolean
        type: object
    required:
    - action
    - rules
    type: object
  dto.FinishLessonResponse:
    properties:
      lessonResult:
        $ref: '#/definitions/dto.LessonResult'
      progress:
        $ref: '#/definitions/dto.FinishLessonResults'
      streak:
        type: string
    type: object
  dto.FinishLessonResults:
    properties:
      currentLevel:
        type: integer
      currentXp:
        type: integer
      isImproved:
        type: boolean
      isLvlUp:
        type: boolean
      maxXp:
        type: integer
      prevBestResult:
        type: integer
      prevLevel:
        type: integer
      prevXp:
        type: integer
      xpForNextLevel:
        type: integer
      xpGained:
        type: integer
    type: object
  dto.FolkloreDTO:
    properties:
      author:
        type: string
      content:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      likesCount:
        type: integer
      mediaUrl:
        type: string
      name:
        type: string
      region:
        type: string
      translations:
        items:
          $ref: '#/definitions/dto.FolkloreTranslationDTO'
        type: array
      type:
        type: string
    type: object
  dto.FolkloreTranslationDTO:
    properties:
      content:
        type: string
      explanation:
        type: string
      folkloreID:
        type: integer
      id:
        type: integer
      language:
        type: string
      name:
        type: string
    type: object
  dto.GetFolkloreResponse:
    properties:
      folklore:
        $ref: '#/definitions/dto.FolkloreDTO'
      streak:
        type: string
    type: object
  dto.GetMeResponse:
    properties:
      streak:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.GetSlangResponse:
    properties:
      regionSlang:
        $ref: '#/definitions/dto.RegionSlang'
      streak:
        type: string
    type: object
  dto.GetTraditionResponse:
    properties:
      regionTradition:
        $ref: '#/definitions/dto.RegionTraditions'
      streak:
        type: string
    type: object
  dto.LessonBlockDTO:
    properties:
      contentText:
        type: string
      contentType:
        type: string
      contentUrl:
        type: string
      id:
        type: integer
      lessonId:
        type: integer
      name:
        type: string
      position:
        type: integer
    type: object
  dto.LessonDTO:
    properties:
      author:
        type: string
      bestResult:
        $ref: '#/definitions/dto.LessonResult'
      blocks:
        items:
          $ref: '#/definitions/dto.LessonBlockDTO'
        type: array
      description:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      lessonStatus:
        type: string
      name:
        type: string
      requiredLevel:
        type: integer
      results:
        items:
          $ref: '#/definitions/dto.LessonResult'
        type: array
      reward:
        type: integer
    type: object
  dto.LessonResult:
    properties:
      id:
        type: integer
      lessonId:
        type: integer
      pass:
        type: boolean
      passTime:
        type: string
      result:
        type: integer
      testId:
        type: integer
      userId:
        type: integer
    type: object
  dto.LikeFolkloreResponse:
    properties:
      folklore:
        $ref: '#/definitions/dto.FolkloreDTO'
      liked:
        type: boolean
      streak:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      streak:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.Question:
    properties:
      id:
        type: integer
      options:
        items:
          $ref: '#/definitions/dto.QuestionOption'
        type: array
      testId:
        type: integer
      text:
        type: string
    type: object
  dto.QuestionOption:
    properties:
      id:
        type: integer
      isCorrect:
        type: boolean
      questionId:
        type: integer
      text:
        type: string
    type: object
  dto.QuestionOptionsUpdate:
    properties:
      id:
        type: integer
      isCorrect:
        type: boolean
      text:
        type: string
    type: object
  dto.QuestionUpdate:
    properties:
      id:
        type: integer
      questionOptionsUpd:
        items:
          $ref: '#/definitions/dto.QuestionOptionsUpdate'
        type: array
      text:
        type: string
    type: object
  dto.RefreshTokenResponse:
    properties:
      accessToken:
        type: string
      status:
        type: string
      streak:
        type: string
      user:
        $ref: '#/definitions/dto.UserClaims'
    type: object
  dto.Region:
    properties:
      code:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      isActive:
        type: boolean
      kind:
        type: string
      regionSlang:
        items:
          $ref: '#/definitions/dto.RegionSlang'
        type: array
      regionStatus:
        type: string
      regionTraditions:
        items:
          $ref: '#/definitions/dto.RegionTraditions'
        type: array
      requiredLevel:
        type: integer
      translations:
        items:
          $ref: '#/definitions/dto.RegionTranslation'
        type: array
    type: object
  dto.RegionSlang:
    properties:
      id:
        type: integer
      regionId:
        type: integer
      translations:
        items:
          $ref: '#/definitions/dto.RegionSlangTranslation'
        type: array
    type: object
  dto.RegionSlangTranslation:
    properties:
      description:
        type: string
      id:
        type: integer
      language:
        $ref: '#/definitions/models.Language'
      pronounceUrl:
        type: string
      regionSlangId:
        type: integer
      word:
        type: string
    type: object
  dto.RegionTraditions:
    properties:
      id:
        type: integer
      regionId:
        type: integer
      translations:
        items:
          $ref: '#/definitions/dto.RegionTraditionsTranslation'
        type: array
    type: object
  dto.RegionTraditionsTranslation:
    properties:
      description:
        type: string
      id:
        type: integer
      language:
        $ref: '#/definitions/models.Language'
      name:
        type: string
      regionTraditionsId:
        type: integer
    type: object
  dto.RegionTranslation:
    properties:
      description:
        type: string
      id:
        type: integer
      language:
        $ref: '#/definitions/models.Language'
      name:
        type: string
      regionId:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.Streak:
    properties:
      currentStreak:
        type: integer
      id:
        type: integer
      longestStreak:
        type: integer
      userID:
        type: integer
    type: object
  dto.Test:
    properties:
      id:
        type: integer
      lessonId:
        type: integer
      questions:
        items:
          $ref: '#/definitions/dto.Question'
        type: array
    type: object
  dto.TestUpdate:
    properties:
      id:
        type: integer
      questionsUpd:
        items:
          $ref: '#/definitions/dto.QuestionUpdate'
        type: array
      reward:
        type: integer
    type: object
  dto.UpdatableFolkloreFieldsDTO:
    properties:
      author:
        type: string
      content:
        type: string
      imageUrl:
        type: string
      mediaUrl:
        type: string
      name:
        type: string
      region:
        type: string
      translations:
        items:
          $ref: '#/definitions/dto.FolkloreTranslationDTO'
        type: array
      type:
        type: string
    type: object
  dto.UpdateLessonBlockDTO:
    properties:
      contentText:
        type: string
      contentType:
        type: string
      contentUrl:
        type: string
      lessonID:
        type: integer
      name:
        type: string
      position:
        type: integer
    type: object
  dto.UpdateLessonDTO:
    properties:
      author:
        type: string
      description:
        type: string
      imageUrl:
        type: string
      name:
        type: string
      requiredLevel:
        type: integer
      reward:
        type: integer
    type: object
  dto.User:
    properties:
      authProvider:
        type: string
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      password:
        type: string
      progress:
        $ref: '#/definitions/dto.UserProgress'
      role:
        type: string
      streak:
        $ref: '#/definitions/dto.Streak'
      username:
        type: string
    type: object
  dto.UserAchievement:
    properties:
      achieved:
        type: boolean
      achievementId:
        type: integer
      id:
        type: integer
      quantity:
        type: integer
      userId:
        type: integer
    type: object
  dto.UserActivityDTO:
    properties:
      action:
        type: string
      entityID:
        type: integer
      entityType:
        $ref: '#/definitions/models.EventEntityType'
      id:
        type: integer
      time:
        type: string
      userID:
        type: integer
    type: object
  dto.UserAnswers:
    properties:
      lessonId:
        type: integer
      testId:
        type: integer
      userAns:
        additionalProperties:
          type: integer
        type: object
      userId:
        type: integer
    type: object
  dto.UserClaims:
    properties:
      email:
        type: string
      role:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  dto.UserProgress:
    properties:
      XpForNextLevel:
        type: integer
      XpTotal:
        type: integer
      id:
        type: integer
      level:
        type: integer
      userID:
        type: integer
    type: object
  dto.UserUpdatableFields:
    properties:
      avatar:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  dto.WordExplain:
    properties:
      block:
        type: string
      lang:
        type: string
      word:
        type: string
    type: object
  dto.WordExplainResult:
    properties:
      context:
        type: string
      result:
        type: string
    type: object
  jwt.RefreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  models.Actions:
    enum:
    - lesson_completed
    - folklore_liked
    - folklore_disliked
    - folklore_readed
    - level_upgraded
    - region_slang_readed
    - region_tradition_readed
    type: string
    x-enum-varnames:
    - Lesson_completed
    - Folklore_liked
    - Folklore_disliked
    - Folklore_readed
    - Level_upgraded
    - Region_slang_readed
    - Region_tradition_readed
  models.EventEntityType:
    enum:
    - folklore
    - lesson
    - user
    - slang
    - tradition
    type: string
    x-enum-varnames:
    - FolkloreEntityType
    - LessonEntityType
    - UserEntityType
    - SlangEntityType
    - TraditionEntityType
  models.Language:
    enum:
    - KZ
    - EN
    - RU
    type: string
    x-enum-varnames:
    - KZ
    - EN
    - RU
  user.ConfirmPasswordChangeRequest:
    properties:
      password:
        example: NewStrongPass123!
        type: string
    type: object
  user.VerifyPasswordResetCodeRequest:
    properties:
      code:
        example: "123456"
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Api server for DaraTil PLatform
  title: DaraTil Backend
  version: "0.2"
paths:
  /achievement/create:
    post:
      consumes:
      - application/json
      description: Create new achievement (admin only)
      parameters:
      - description: Achievement data
        in: body
        name: achievement
        required: true
        schema:
          $ref: '#/definitions/dto.Achievement'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create achievement
      tags:
      - Achievement
  /achievement/delete/{id}:
    delete:
      description: Delete achievement by ID (admin only)
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete achievement
      tags:
      - Achievement
  /achievement/getAll:
    get:
      description: Get all achievements for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Achievement'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all achievements
      tags:
      - Achievement
  /achievement/getById/{id}:
    get:
      description: Get achievement details by ID for current user
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Achievement'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get achievement by ID
      tags:
      - Achievement
  /achievement/update:
    patch:
      consumes:
      - application/json
      description: Update achievement (admin only)
      parameters:
      - description: Achievement data
        in: body
        name: achievement
        required: true
        schema:
          $ref: '#/definitions/dto.Achievement'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update achievement
      tags:
      - Achievement
  /actionRules/create:
    post:
      consumes:
      - application/json
      description: Create new action rule (admin only)
      parameters:
      - description: ActionRule payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ActionRuleDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create action rule
      tags:
      - ActionRule
  /actionRules/createMulti:
    post:
      consumes:
      - application/json
      description: Create multiple action rules (admin only)
      parameters:
      - description: ActionRules payload
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.ActionRuleDTO'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create multiple action rules
      tags:
      - ActionRule
  /actionRules/delete/{action}:
    delete:
      description: Delete action rule by action (admin only)
      parameters:
      - description: Action
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete action rule
      tags:
      - ActionRule
  /actionRules/get/{action}:
    get:
      description: Get action rule by action (admin only)
      parameters:
      - description: Action
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActionRuleDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get action rule by action
      tags:
      - ActionRule
  /actionRules/getAll:
    get:
      description: Get all action rules (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActionRuleDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all action rules
      tags:
      - ActionRule
  /actionRules/update:
    patch:
      consumes:
      - application/json
      description: Update action rule (admin only)
      parameters:
      - description: ActionRule payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ActionRuleDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update action rule
      tags:
      - ActionRule
  /activity:
    get:
      description: 'Retries recent user activities: Lesson Finish, Folklore like etc.
        For now there is only three activities:"lesson_completed", "folklore_liked",
        "folklore_disliked"'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserActivityDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get User Activities
      tags:
      - Activity
  /assistant/explainWord:
    post:
      consumes:
      - application/json
      description: Explaining of the word in its context by the help of AI
      parameters:
      - description: Word Request with its block
        in: body
        name: wordReq
        required: true
        schema:
          $ref: '#/definitions/dto.WordExplain'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WordExplainResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Explaining of the word in its context
      tags:
      - Assistant
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes current refresh token (if present) and clears the "refreshToken"
        cookie.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/me:
    get:
      description: Get authenticated user profile
      produces:
      - application/json
      responses:
        "200":
